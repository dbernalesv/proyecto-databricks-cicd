[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "proyecto-databricks-cicd"
version = "0.1.0"
description = "Laboratorio educativo de CI/CD para Azure Databricks"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit[toml]>=1.8,<2",
  "detect-secrets>=1.5,<2",
  "pip-audit>=2.8,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.12,<1",
  "sqlfluff>=4.2,<5",
  "yamllint>=1.37,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"proyecto_test/**/*.py" = ["F821", "S101"]

[tool.bandit]
exclude_dirs = ["tests"]
