name: Deploy exact main commit to Dev

on:
  push:
    branches: [main]
    # Un merge sólo documental sigue pasando CI, pero no necesita autenticarse
    # en Databricks ni ejecutar cómputo. Mantén esta lista alineada con el árbol
    # sincronizado por databricks.yml y con la automatización del despliegue.
    paths:
      - "proyecto_test/**"
      - "resources/**"
      - "scripts/**"
      - "databricks.yml"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/reusable-databricks-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: databricks-dev
  cancel-in-progress: true

jobs:
  deploy:
    uses: ./.github/workflows/reusable-databricks-deploy.yml
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      bundle_target: dev
      project_root: proyecto_test
      workspace_root: /Workspace/data/proyecto_test
      smoke_job_key: smoke_test
