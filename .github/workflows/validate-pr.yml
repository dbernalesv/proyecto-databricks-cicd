name: Validate pull request

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Python, SQL and YAML
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and validation tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade \
            "pip>=26.2" "setuptools>=83.0.0"
          python -m pip install --disable-pip-version-check --editable ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: SQLFluff
        run: sqlfluff lint --ignore-local-config --config .sqlfluff sql

      - name: YAML lint
        run: yamllint .

      - name: Unit tests
        run: pytest

      - name: Validate deployment manifest guardrails
        run: |
          python scripts/reconcile_workspace.py manifest \
            --project-root proyecto_test \
            --workspace-root /Workspace/data/proyecto_test \
            --git-sha "$GITHUB_SHA" \
            --output deployment-manifest.json

  security:
    name: Security checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project and security tools
        run: |
          python -m pip install --disable-pip-version-check --upgrade \
            "pip>=26.2" "setuptools>=83.0.0"
          python -m pip install --disable-pip-version-check --editable ".[dev]"

      - name: Detect potential secrets
        shell: bash
        run: |
          mapfile -t tracked_files < <(git ls-files)
          detect-secrets-hook "${tracked_files[@]}"

      - name: Static application security testing
        run: bandit --recursive src scripts --configfile pyproject.toml

      - name: Dependency vulnerability audit
        run: pip-audit --cache-dir "$RUNNER_TEMP/pip-audit"

  terraform:
    name: Terraform static validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd  # v3
        with:
          terraform_version: "1.16.5"

      - name: Check formatting
        run: terraform fmt -check -recursive infra

      - name: Initialize Azure stack without backend
        run: terraform -chdir=infra/azure/dev init -backend=false -input=false

      - name: Validate Azure stack
        run: terraform -chdir=infra/azure/dev validate

      - name: Initialize Databricks stack without backend
        run: terraform -chdir=infra/databricks/dev init -backend=false -input=false

      - name: Validate Databricks stack
        run: terraform -chdir=infra/databricks/dev validate
